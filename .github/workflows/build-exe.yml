name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pyinstaller

      - name: Import check
        run: python -c "import app.main; print('import ok')"

      # Same headless self-tests as the release workflow. tools.scan_selftest
      # and tools.scan_e2e_selftest need real monitors, so they run locally.
      - name: Self-tests
        run: |
          python -m tools.selftest
          python -m tools.workflow_selftest
          python -m tools.refinery_selftest
          python -m tools.combat_selftest
          python -m tools.blueprint_selftest

      - name: Build
        run: pyinstaller --noconfirm --clean citizen-assistant.spec

      - name: Package
        run: Compress-Archive -Path dist/CitizenAssistant/* -DestinationPath CitizenAssistant-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CitizenAssistant-windows-x64
          path: CitizenAssistant-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
