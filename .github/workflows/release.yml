name: Release Windows EXE

# Tag a commit to publish a download:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# or run it by hand for a tag that already exists (Actions → Release Windows
# EXE → Run workflow, or `gh workflow run release.yml -f tag=v1.0.0`). A
# fork does not run push-triggered workflows until Actions is enabled for it
# once, and a manual run does not need that.
#
# The job refuses to publish when the tag does not match VERSION in
# app/version.py, so a release can never advertise the wrong build number.
# The release text is release-notes/<version>.md plus "How to install"
# (tools/release_body.py), followed by GitHub's generated notes. Two
# downloads are published: the standalone zip (unzip and run) and
# SCAssistant-<version>-Setup.exe (installer).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pyinstaller pyyaml

      - name: Check the tag matches the build
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}".TrimStart('v')
          $line = Select-String -Path app/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          $ver = $line.Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            throw "tag $tag does not match VERSION $ver in app/version.py"
          }
          Write-Host "Releasing v$ver"

      - name: Import check
        run: python -c "import app.main; print('import ok')"

      # The headless self-tests. The Qt self-tests (scan, scan_e2e, overlay,
      # update, hotkeys, settings_persist, dataage, datasafety) need a display
      # and tracking_selftest has a speed limit for a fast PC, so those run
      # locally.
      - name: Self-tests
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m tools.selftest
          python -m tools.workflow_selftest
          python -m tools.refinery_selftest
          python -m tools.combat_selftest
          python -m tools.blueprint_selftest
          python -m tools.signature_selftest

      # RELEASE_CHECK=1 also fails when app/version.py's VERSION has no
      # release-notes/<version>.md.
      - name: Release notes check
        run: python tools/release_notes_selftest.py
        env:
          RELEASE_CHECK: "1"
          PYTHONIOENCODING: utf-8

      # Stops the release before the build when release-notes/<version>.md is
      # missing or its first line isn't "## What's new in <version>".
      - name: Release notes
        run: python tools/release_body.py "${{ env.TAG }}" --out release_notes.md

      - name: Build
        run: pyinstaller --noconfirm --clean sc-assistant.spec

      - name: Package standalone zip
        run: Compress-Archive -Path dist/SCAssistant/* -DestinationPath SCAssistant-windows-x64.zip

      # Inno Setup 6 is preinstalled on windows-latest.
      - name: Build installer
        shell: pwsh
        run: installer\build_installer.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            SCAssistant-windows-x64.zip
            dist/SCAssistant-*-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
