name: Release Windows EXE

# Tag a commit to publish a download:
#
#   git tag v1.2.17
#   git push origin v1.2.17
#
# or run it by hand for a tag that already exists (Actions → Release Windows
# EXE → Run workflow, or `gh workflow run release.yml -f tag=v1.2.17`). A
# fork does not run push-triggered workflows until Actions is enabled for it
# once, and a manual run does not need that.
#
# The job refuses to publish when the tag does not match VERSION in
# app/version.py, so a release can never advertise the wrong build number.
# The release text is that version's section of CHANGES.md, followed by
# GitHub's generated notes. Two downloads are published: the standalone zip
# (unzip and run) and CitizenAssistant-<version>-Setup.exe (installer).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.17"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt pyinstaller

      - name: Check the tag matches the build
        shell: pwsh
        run: |
          $tag = "${{ env.TAG }}".TrimStart('v')
          $line = Select-String -Path app/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"'
          $ver = $line.Matches[0].Groups[1].Value
          if ($tag -ne $ver) {
            throw "tag $tag does not match VERSION $ver in app/version.py"
          }
          Write-Host "Releasing v$ver"

      - name: Import check
        run: python -c "import app.main; print('import ok')"

      # The headless self-tests. tools.scan_selftest and
      # tools.scan_e2e_selftest need real monitors, so they run locally.
      - name: Self-tests
        run: |
          python -m tools.selftest
          python -m tools.workflow_selftest
          python -m tools.refinery_selftest
          python -m tools.combat_selftest
          python -m tools.blueprint_selftest

      - name: Release notes from CHANGES.md
        shell: pwsh
        run: |
          $ver = "${{ env.TAG }}"
          $lines = Get-Content CHANGES.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## $([regex]::Escape($ver))\b" })
          if ($start -lt 0) {
            Set-Content release_notes.md "" -Encoding utf8
            Write-Host "No CHANGES.md section for $ver"
          } else {
            $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
            if ($end -lt 0) { $end = $lines.Count }
            $lines[($start + 1)..($end - 1)] | Set-Content release_notes.md -Encoding utf8
            Write-Host "Release notes: CHANGES.md lines $($start + 2)-$end"
          }

      - name: Build
        run: pyinstaller --noconfirm --clean citizen-assistant.spec

      - name: Package standalone zip
        run: Compress-Archive -Path dist/CitizenAssistant/* -DestinationPath CitizenAssistant-windows-x64.zip

      # Inno Setup 6 is preinstalled on windows-latest.
      - name: Build installer
        shell: pwsh
        run: installer\build_installer.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: release_notes.md
          files: |
            CitizenAssistant-windows-x64.zip
            dist/CitizenAssistant-*-Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
